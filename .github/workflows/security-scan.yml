name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run daily at 2am UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  python-audit:
    name: Python Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: |
          cd backend
          pip-audit -r requirements.txt --format=json --output=pip-audit-results.json || true
          pip-audit -r requirements.txt --format=markdown >> $GITHUB_STEP_SUMMARY || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-results
          path: backend/pip-audit-results.json

      - name: Fail on vulnerable dependencies
        run: |
          cd backend
          # Gating: a non-zero exit from pip-audit fails the job. Known,
          # accepted, or not-yet-fixable advisories can be listed with
          # --ignore-vuln GHSA-xxxx so the gate stays meaningful rather than
          # being globally disabled with `|| true`.
          pip-audit -r requirements.txt --strict

  node-audit:
    name: Node.js Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --json > npm-audit-results.json || true
          npm audit --omit=dev >> $GITHUB_STEP_SUMMARY || true

      - name: Upload audit results
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: frontend/npm-audit-results.json

      - name: Fail on high/critical vulnerabilities
        run: |
          cd frontend
          # npm audit returns non-zero if vulnerabilities found
          npm audit --audit-level=high --omit=dev

  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build -t check-review-backend:scan -f docker/Dockerfile.backend .

      # First pass: produce SARIF for the Security tab (never fails, so the
      # upload below always has a file).
      - name: Run Trivy on backend (report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'check-review-backend:scan'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-backend-results.sarif'

      # Second pass: gate the build. exit-code 1 fails the job on any fixable
      # CRITICAL/HIGH finding; ignore-unfixed avoids flaking on base-image CVEs
      # with no available patch.
      - name: Fail on container vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'check-review-backend:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python, javascript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      # Report pass: emit SARIF for the Security tab without failing, so the
      # upload always has a file even when the gating pass below fails.
      - name: Run Semgrep (report)
        run: semgrep scan --config=auto --sarif --output=semgrep-results.sarif || true
        env:
          SEMGREP_RULES: >-
            p/security-audit
            p/secrets
            p/python
            p/typescript

      - name: Upload Semgrep results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif

      # Gating pass: --error makes Semgrep exit non-zero on findings so a
      # flagged injection/secret blocks the merge instead of passing green.
      - name: Fail on Semgrep findings
        run: semgrep scan --config=auto --error --severity=ERROR

  security-summary:
    name: Security Summary
    needs: [python-audit, node-audit, container-scan, secret-scan, sast-semgrep]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python Audit | ${{ needs.python-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Audit | ${{ needs.node-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY

      # This job gates the workflow: fail if any security scan did not succeed,
      # so a failed scan cannot be merged past a green Security Summary.
      - name: Enforce all scans passed
        run: |
          for result in \
            "${{ needs.python-audit.result }}" \
            "${{ needs.node-audit.result }}" \
            "${{ needs.container-scan.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.sast-semgrep.result }}"; do
            if [ "$result" != "success" ]; then
              echo "::error::A security scan did not pass (result: $result)"
              exit 1
            fi
          done
